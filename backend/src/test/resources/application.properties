# Configuracion de pruebas: apunta al Mongo del docker compose con credenciales
# (la conexion por defecto del main es localhost sin user/pass, valido fuera de Docker).
MONGO_URI=mongodb://libreqr:devlibreqrpass@localhost:27017/libreqr

# Los E2E de QR/campanas usan el header X-User-Id como atajo de identidad hasta tener
# login con cookie en los tests; el filtro solo lo acepta con esta propiedad a true.
libreqr.dev.allow-header-owner=true
