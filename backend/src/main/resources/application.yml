spring:
  application:
    name: libreqr-back

  # --- Conexion a MongoDB (solo la conexion; sin consultas ni mapeo por ahora) ---
  # Spring Boot 4.x usa el prefijo `spring.mongodb.*` (el antiguo `spring.data.mongodb.*`
  # esta deprecado). La URI es la fuente unica de verdad; en Compose se sobreescribe
  # con MONGO_URI. `representation.uuid` es requerido para persistir campos UUID.
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/libreqr}
    representation:
      uuid: standard

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.mongodb.driver: INFO
    org.springframework.data.mongodb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      # El backend solo queda "listo" si el inicializador pudo conectar y verificar
      # las colecciones al arrancar (ver MongoCollectionInitializer).
      probes:
        enabled: true
